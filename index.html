<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for bro</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #555 0%, #222 45%, #000 100%);
    font-family: Impact, Arial Black, sans-serif;
    overflow: hidden;
}

.meme {
    width: min(900px, 94vw);
    height: min(650px, 88vh);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 8px solid white;
    overflow: hidden;
    background:
        linear-gradient(135deg, #111, #333, #111);
    box-shadow:
        0 0 30px rgba(255,255,255,.3),
        0 0 100px rgba(255,0,0,.25);
}

/* Dramatic rays */
.meme::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: repeating-conic-gradient(
        from 0deg,
        rgba(255,255,255,.08) 0deg 8deg,
        transparent 8deg 20deg
    );
    animation: rotate 12s linear infinite;
}

/* Red flash */
.meme::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,0,0,.15);
    animation: flash 1.5s infinite;
}

.text {
    position: relative;
    z-index: 5;
    text-align: center;
    color: white;
    font-size: clamp(70px, 16vw, 190px);
    line-height: .8;
    letter-spacing: 8px;

    -webkit-text-stroke: 6px black;

    text-shadow:
        8px 8px 0 black,
        -5px -5px 0 black,
        0 0 20px red,
        0 0 50px red;

    animation: shake .15s infinite alternate;
}

.small {
    position: absolute;
    z-index: 6;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: clamp(14px, 3vw, 25px);
    text-shadow: 3px 3px 0 black;
    white-space: nowrap;
}

.emoji {
    position: absolute;
    font-size: 70px;
    z-index: 4;
    animation: float 2s ease-in-out infinite;
}

.e1 {
    top: 30px;
    left: 35px;
}

.e2 {
    top: 35px;
    right: 35px;
    animation-delay: .4s;
}

.e3 {
    bottom: 70px;
    left: 45px;
    animation-delay: .8s;
}

.e4 {
    bottom: 70px;
    right: 45px;
    animation-delay: 1.2s;
}

@keyframes shake {
    from {
        transform: translate(-3px, 2px) rotate(-1deg);
    }
    to {
        transform: translate(3px, -2px) rotate(1deg);
    }
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes flash {
    0%, 80%, 100% {
        opacity: 0;
    }

    85% {
        opacity: 1;
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-20px) rotate(5deg);
    }
}

/* Mobile */
@media (max-width: 600px) {
    .meme {
        height: 70vh;
        border-width: 5px;
    }

    .text {
        letter-spacing: 3px;
        -webkit-text-stroke: 3px black;
        text-shadow:
            4px 4px 0 black,
            0 0 15px red;
    }

    .emoji {
        font-size: 45px;
    }
}
</style>
</head>

<body>

<div class="meme">

    <div class="emoji e1">💀</div>
    <div class="emoji e2">😭</div>
    <div class="emoji e3">🤡</div>
    <div class="emoji e4">💀</div>

    <div class="text">
        KUPAL
    </div>

    <div class="small">
        BRO IS GAY 👬 💀
    </div>

</div>

</body>
</html>
